name: Publish Snapshot to Sonatype

on:
  push:
    branches: [ main, "maintenance/*" ]

jobs:

  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:

      - name: Cloning the Repository
        uses: actions/checkout@v4

      - name: Get current version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current project version: $VERSION"

      - name: Ensure Snapshot Version
        id: next_version
        run: |

          CURRENT=${{ steps.version.outputs.version }}
      
          # Exit if NOT a snapshot
          if [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "::error::Expected a -SNAPSHOT version, but found '$CURRENT'."
            echo "The main branch must end with -SNAPSHOT before running a release."
            echo "Please bump the version in pom.xml and push before retrying."
            exit 1
          fi

      - name: Set up JDK 21 and Maven Credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Install native dependencies
        run: |
          sudo apt-get install -y libpulse0 pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink

      - name: Build and Publish Snapshot
        run: mvn -B -Pcentral-publish clean deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

      - name: Generate API documentation
        run: mvn -B javadoc:aggregate -Pdocs -pl '!debug'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308044622771:role/apidocs-ci
          aws-region: us-east-1

      - name: Publish snapshot docs to S3
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          aws s3 sync target/site/apidocs/ "s3://namazu-apidocs/crossfire/${VERSION}-${SHORT_SHA}/" --delete
